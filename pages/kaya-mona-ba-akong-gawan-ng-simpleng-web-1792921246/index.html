Here's a complete, ready-to-use HTML page for a simple personal website. It includes a hero section, about area, services, contact form, and a light/dark theme toggle. All CSS and JavaScript are inline, so it works as a single file you can open in any browser.

<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mona — Simpleng Website</title>
<meta name="description" content="Isang simple at malinis na personal na website." />
<style>
  :root {
    --bg: #f6f7fb;
    --bg-soft: #ffffff;
    --text: #0f172a;
    --muted: #5b6478;
    --line: rgba(15, 23, 42, 0.09);
    --accent: #6366f1;
    --accent-2: #8b5cf6;
    --shadow: 0 18px 45px rgba(15, 23, 42, 0.10);
    --radius: 20px;
  }

  html[data-theme="dark"] {
    --bg: #0a0f1e;
    --bg-soft: #111a2f;
    --text: #e8eefc;
    --muted: #9aa7c2;
    --line: rgba(255, 255, 255, 0.10);
    --accent: #818cf8;
    --accent-2: #a78bfa;
    --shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    transition: background 0.35s ease, color 0.35s ease;
  }

  .glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(600px 400px at 12% -5%, rgba(99, 102, 241, 0.22), transparent 70%),
      radial-gradient(520px 380px at 92% 8%, rgba(139, 92, 246, 0.18), transparent 70%);
  }

  .wrap {
    width: min(1080px, 92vw);
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* ---------- NAV ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    border-bottom: 1px solid var(--line);
  }

  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 0;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    letter-spacing: -0.02em;
    font-size: 1.05rem;
  }

  .logo-mark {
    width: 34px;
    height: 34px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .nav-links a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.92rem;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    transition: color 0.2s, background 0.2s;
  }

  .nav-links a:hover { color: var(--text); background: var(--line); }

  .theme-btn {
    border: 1px solid var(--line);
    background: var(--bg-soft);
    color: var(--text);
    width: 40px;
    height: 40px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 1.05rem;
    display: grid;
    place-items: center;
    transition: transform 0.2s, border-color 0.2s;
  }

  .theme-btn:hover { transform: translateY(-2px); border-color: var(--accent); }

  /* ---------- HERO ---------- */
  .hero {
    padding: clamp(56px, 11vw, 110px) 0 clamp(48px, 8vw, 90px);
    display: grid;
    grid-template-columns: 1.15fr 0.85fr;
    gap: 48px;
    align-items: center;
  }

    align-items: center;
    gap: 8px;
