<!DOCTYPE html>

<style>
  :root{

    --text:#141834;
    --muted:#5b6285;

    --accent:#4f46e5;
    --accent-2:#06b6d4;

    --shadow-lg:0 20px 50px rgba(20,24,52,.14);
    --radius:18px;
  }
  html[data-theme="dark"]{
    --bg:#080b18;

    --text:#e9ecff;
    --muted:#9aa3c7;
    --border:#1f2947;
    --accent:#7c74ff;
    --accent-2:#22d3ee;
    --shadow:0 10px 30px rgba(0,0,0,.4);
    --shadow-lg:0 20px 50px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;

    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    transition:background .35s ease,color .35s ease;
    overflow-x:hidden;
  }
  img{max-width:100%;display:block}
  a{color:inherit;text-decoration:none}
  .wrap{width:min(1120px,92%);margin-inline:auto}

  /* ---------- NAV ---------- */
  header{
    position:sticky;top:0;z-index:50;

  }
  header.scrolled{border-bottom-color:var(--border);box-shadow:0 4px 20px rgba(20,24,52,.05)}

  .logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:1.05rem}
  .logo-mark{
    width:34px;height:34px;border-radius:11px;flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:grid;place-items:center;color:#fff;font-size:1rem;
    box-shadow:0 6px 16px rgba(79,70,229,.35);
  }
  .nav-links{display:flex;align-items:center;gap:6px}
  .nav-links a{
    padding:9px 14px;border-radius:10px;font-size:.93rem;font-weight:600;color:var(--muted);
    transition:color .2s, background .2s;
  }
  .nav-links a:hover{color:var(--text);background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .nav-actions{display:flex;align-items:center;gap:10px}

    width:40px;height:40px;border-radius:12px;border:1px solid var(--border);
